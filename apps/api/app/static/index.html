<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tenant Workspace</title>
  <style>
    :root { --ink:#0f172a; --muted:#475569; --line:#e2e8f0; --teal:#0f766e; --bg:#f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.45 Georgia, serif; color: var(--ink); background: var(--bg); }
    header { background: var(--ink); color: white; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header a { color: #99f6e4; margin-left: 1rem; font-size: .9rem; }
    main { max-width: 960px; margin: 0 auto; padding: 1.25rem; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .card { background: white; border: 1px solid var(--line); padding: 1rem; }
    h2 { margin: 0 0 .75rem; font-size: 1.15rem; }
    input { width: 100%; margin: .25rem 0 .5rem; padding: .45rem .55rem; font: inherit; border: 1px solid var(--line); }
    button { font: inherit; background: var(--teal); color: white; border: 0; padding: .45rem .8rem; cursor: pointer; }
    button.ghost { background: white; color: var(--teal); border: 1px solid var(--teal); }
    .row { display: flex; gap: .5rem; align-items: center; }
    .muted { color: var(--muted); font-size: .92rem; }
    .item { border-top: 1px solid var(--line); padding: .55rem 0; }
    .err { color: #b91c1c; min-height: 1.2em; }
    .ok { color: var(--teal); }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <strong>Tenant Workspace</strong>
    <nav><a href="/docs">API docs</a><a href="/health">Health</a></nav>
  </header>
  <main>
    <p class="muted" id="who">Not signed in.</p>
    <p class="err" id="err"></p>
    <div class="grid">
      <section class="card">
        <h2>Sign in</h2>
        <input id="email" type="email" value="owner@workspace.dev" />
        <input id="password" type="password" value="ChangeMe123!" />
        <div class="row">
          <button id="btnIn">Sign in</button>
          <button class="ghost" id="btnUp">Create account</button>
        </div>
      </section>
      <section class="card">
        <h2>Workspaces</h2>
        <div class="row">
          <input id="wsname" value="New workspace" />
          <button id="btnWs">Create</button>
        </div>
        <div id="workspaces"></div>
      </section>
      <section class="card">
        <h2>Projects</h2>
        <p class="muted" id="wsLabel">Select a workspace.</p>
        <div class="row">
          <input id="ptitle" value="New project" />
          <button id="btnProj">Add</button>
        </div>
        <div id="projects"></div>
      </section>
      <section class="card">
        <h2>Billing and audit</h2>
        <div id="billing" class="muted">Select a workspace.</div>
        <div id="audit"></div>
      </section>
    </div>
  </main>
  <script>
    let access = sessionStorage.getItem("access") || "";
    let selected = "";
    function showError(e) { err.textContent = e && e.message ? e.message : (e || ""); }
    async function api(path, opts = {}) {
      const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
      if (access) headers.Authorization = "Bearer " + access;
      const res = await fetch(path, { ...opts, headers });
      const text = await res.text();
      let data = {};
      try { data = text ? JSON.parse(text) : {}; } catch { data = { message: text }; }
      if (!res.ok) throw new Error(data.message || data.code || text || res.status);
      return data;
    }
    async function signin() {
      showError("");
      const tokens = await api("/auth/sign-in", { method: "POST", body: JSON.stringify({ email: email.value, password: password.value }) });
      access = tokens.access_token;
      sessionStorage.setItem("access", access);
      who.textContent = "Signed in as " + email.value;
      who.className = "ok";
      await loadWs();
    }
    async function signup() {
      showError("");
      const tokens = await api("/auth/sign-up", { method: "POST", body: JSON.stringify({ email: email.value, password: password.value }) });
      access = tokens.access_token;
      sessionStorage.setItem("access", access);
      who.textContent = "Account created: " + email.value;
      who.className = "ok";
      await loadWs();
    }
    async function loadWs() {
      const items = await api("/workspaces");
      workspaces.innerHTML = items.length ? items.map(w =>
        "<div class='item'><button class='ghost' onclick=\"openWs('" + w.id + "','" + w.name.replace(/'/g,'') + "')\">" + w.name + "</button> · " + w.plan + " · " + w.role + "</div>"
      ).join("") : "<p class='muted'>No workspaces yet.</p>";
    }
    async function createWs() {
      showError("");
      await api("/workspaces", { method: "POST", body: JSON.stringify({ name: wsname.value }) });
      await loadWs();
    }
    async function openWs(id, name) {
      showError("");
      selected = id;
      wsLabel.textContent = "Workspace: " + name;
      const items = await api("/workspaces/" + id + "/projects");
      projects.innerHTML = items.length ? items.map(p => "<div class='item'>" + p.title + "</div>").join("") : "<p class='muted'>No projects.</p>";
      try {
        const bill = await api("/workspaces/" + id + "/billing");
        billing.innerHTML = "<p>Plan <strong>" + bill.plan + "</strong> · " + bill.seats + " seat(s)</p>";
      } catch (e) {
        billing.innerHTML = "<p class='muted'>Billing requires owner/admin/billing role.</p>";
      }
      const logs = await api("/workspaces/" + id + "/audit");
      audit.innerHTML = logs.slice(0, 8).map(a => "<div class='item muted'>" + a.action + " — " + a.detail + "</div>").join("");
    }
    async function createProject() {
      if (!selected) return showError("Select a workspace first.");
      showError("");
      await api("/workspaces/" + selected + "/projects", { method: "POST", body: JSON.stringify({ title: ptitle.value }) });
      await openWs(selected, wsLabel.textContent.replace("Workspace: ", ""));
    }
    function bind(id, fn) { document.getElementById(id).onclick = () => fn().catch(showError); }
    bind("btnIn", signin); bind("btnUp", signup); bind("btnWs", createWs); bind("btnProj", createProject);
    if (access) { who.textContent = "Session restored."; loadWs().catch(() => { access = ""; sessionStorage.removeItem("access"); }); }
  </script>
</body>
</html>
