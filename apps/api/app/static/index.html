<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Tenant Workspace</title>
  <link rel="stylesheet" href="/assets/shell.css" />
</head>
<body class="auth">
  <main class="auth-card">
    <p class="kicker">Tenant Workspace</p>
    <h1>Sign in</h1>
    <p class="muted" id="who">Use the seed owner or create an account.</p>
    <p class="err" id="err"></p>
    <label>Email</label>
    <input id="email" type="email" value="owner@workspace.dev" />
    <label>Password</label>
    <input id="password" type="password" value="ChangeMe123!" />
    <div class="row">
      <button type="button" id="btnIn">Sign in</button>
      <button type="button" class="ghost" id="btnUp">Create account</button>
    </div>
  </main>
  <script src="/assets/login.js"></script>
</body>
</html>
